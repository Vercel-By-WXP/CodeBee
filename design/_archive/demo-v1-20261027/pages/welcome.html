<!DOCTYPE html>
<html lang="zh-CN" data-surface="paper" data-density="comfy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeBee · 选择工作形态</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../base.css">
<link rel="stylesheet" href="../components.css">
<style>
  /* 页面专属：只写布局，不写任何颜色/字号/圆角 */
  body {
    background-image: radial-gradient(
      880px 520px at 8% -10%,
      color-mix(in srgb, var(--accent) 8%, transparent),
      transparent 64%
    );
    background-repeat: no-repeat;
  }

  .stage {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
  }

  .stage-main {
    flex: 1;
    display: grid;
    place-items: center;
    padding: var(--s-10) var(--s-6) var(--s-8);
  }

  .intro {
    width: 100%;
    max-width: 1000px;
  }

  .intro-head {
    margin-bottom: var(--s-8);
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: var(--s-2);
    height: 24px;
    padding: 0 var(--s-2) 0 6px;
    margin-bottom: var(--s-4);
    border-radius: var(--r-pill);
    border: 1px solid var(--line);
    background: var(--surface);
    font-size: var(--font-caption);
    color: var(--text-2);
    box-shadow: var(--sh-1);
  }

  .eyebrow .dot {
    margin-left: 2px;
  }

  .intro h1 {
    font-size: clamp(27px, 2.9vw, 40px);
    line-height: 1.18;
    font-weight: var(--w-semi);
    letter-spacing: -0.024em;
    max-width: 15em;
  }

  .intro-sub {
    margin-top: var(--s-3);
    font-size: var(--font-body-lg);
    line-height: var(--lh-snug);
    color: var(--text-2);
    max-width: 27em;
  }

  /* 四张卡：2×2。等宽不等高也会对齐，因为都是固定节奏 */
  .choice-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: var(--s-4);
  }

  .choice {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 208px;
    padding: var(--s-5);
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-4);
    box-shadow: var(--sh-1);
    transition: border-color var(--dur-2) var(--ease-out),
      box-shadow var(--dur-2) var(--ease-out),
      transform var(--dur-2) var(--ease-out);
    overflow: hidden;
  }

  .choice::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 4%, transparent), transparent 46%);
    opacity: 0;
    transition: opacity var(--dur-2) var(--ease-out);
    pointer-events: none;
  }

  .choice:hover {
    border-color: var(--line-strong);
    box-shadow: var(--sh-3);
    transform: translateY(-2px);
  }

  .choice:hover::before {
    opacity: 1;
  }

  .choice:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .choice-top {
    display: flex;
    align-items: flex-start;
    gap: var(--s-3);
  }

  .choice-mark {
    display: grid;
    place-items: center;
    width: 38px;
    height: 38px;
    border-radius: var(--r-3);
    background: var(--surface-3);
    border: 1px solid var(--line);
    color: var(--text-2);
    flex-shrink: 0;
    transition: background var(--dur-2) var(--ease-out),
      color var(--dur-2) var(--ease-out),
      border-color var(--dur-2) var(--ease-out);
  }

  .choice-mark .ico {
    width: 19px;
    height: 19px;
  }

  .choice:hover .choice-mark {
    background: var(--accent-soft);
    border-color: var(--accent-line);
    color: var(--accent);
  }

  .choice-name {
    flex: 1;
    min-width: 0;
  }

  .choice-name b {
    display: block;
    font-size: var(--font-body-lg);
    font-weight: var(--w-semi);
    letter-spacing: -0.01em;
  }

  .choice-name span {
    display: block;
    margin-top: 1px;
    font-size: var(--font-caption);
    color: var(--text-3);
  }

  .choice-key {
    font-family: var(--font-mono);
    font-size: var(--font-label);
    color: var(--text-3);
    flex-shrink: 0;
    transition: color var(--dur-2) var(--ease-out);
  }

  .choice:hover .choice-key {
    color: var(--accent);
  }

  .choice-intent {
    margin-top: 2px;
    font-size: 15px;
    line-height: var(--lh-snug);
    font-weight: var(--w-medium);
    color: var(--text);
  }

  .choice-what {
    font-size: var(--font-small);
    line-height: var(--lh-ui);
    color: var(--text-2);
  }

  .choice-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: auto;
    padding-top: var(--s-2);
  }

  .choice-go {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: var(--font-caption);
    font-weight: var(--w-medium);
    color: var(--text-3);
    transition: color var(--dur-2) var(--ease-out);
  }

  .choice-go .ico {
    width: 13px;
    height: 13px;
    transition: transform var(--dur-2) var(--ease-out);
  }

  .choice:hover .choice-go {
    color: var(--accent);
  }

  .choice:hover .choice-go .ico {
    transform: translateX(3px);
  }

  .choice.is-last::after {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: var(--accent);
  }

.choice.is-last .choice-go {
    color: var(--accent);
  }

  /* 底部：不是导航，是「还可以从这里走」 */
  .stage-foot {
    display: flex;
    align-items: center;
    gap: var(--s-4);
    padding: var(--s-3) var(--s-6);
    border-top: 1px solid var(--line);
    background: color-mix(in srgb, var(--bg) 70%, transparent);
    backdrop-filter: blur(8px);
    font-size: var(--font-caption);
    color: var(--text-3);
  }

  .stage-foot .row {
    gap: var(--s-3);
  }

  .foot-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    color: var(--text-2);
    transition: color var(--dur-1) var(--ease-out);
  }

  .foot-link:hover {
    color: var(--accent);
  }

  .foot-link .ico {
    width: 13px;
    height: 13px;
  }

  @media (max-width: 860px) {
    .choice-grid {
      grid-template-columns: minmax(0, 1fr);
    }
    .intro h1 {
      font-size: var(--font-h1);
    }
    .stage-main {
      padding: var(--s-6) var(--s-4) var(--s-6);
    }
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
  <defs>
    <g id="i-book" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 3h12a1 1 0 0 1 1 1v15a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/>
      <path d="M4 17.5h15M8.5 7h6M8.5 11h4"/>
    </g>
    <g id="i-file-check" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/>
      <path d="M14 3v5h5M8.5 14l2 2 4-4"/>
    </g>
    <g id="i-grid" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
      <rect x="3.2" y="3.2" width="7.2" height="7.2" rx="1.6"/>
      <rect x="13.6" y="3.2" width="7.2" height="7.2" rx="1.6"/>
      <rect x="3.2" y="13.6" width="7.2" height="7.2" rx="1.6"/>
      <rect x="13.6" y="13.6" width="7.2" height="7.2" rx="1.6"/>
    </g>
    <g id="i-hive" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
      <path d="M12 2.8 20.2 7.4v9.2L12 21.2 3.8 16.6V7.4z"/>
      <path d="M12 8.2 15.4 10v3.9L12 15.8 8.6 13.9V10z"/>
    </g>
    <g id="i-sun" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2.4v2.2M12 19.4v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.4 12h2.2M19.4 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/>
    </g>
    <g id="i-moon" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
      <path d="M20.5 14.2A8.6 8.6 0 0 1 9.8 3.5a8.6 8.6 0 1 0 10.7 10.7z"/>
    </g>
    <g id="i-settings" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3.1"/>
      <path d="M12 2.6v2.6M12 18.8v2.6M4.4 7.2l2.2 1.3M17.4 15.5l2.2 1.3M4.4 16.8l2.2-1.3M17.4 8.5l2.2-1.3"/>
    </g>
    <g id="i-arrow-right" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4.5 12h14M12.5 5.5 19 12l-6.5 6.5"/>
    </g>
    <g id="i-swap" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 8.5h13M14 5.5l3 3-3 3M20 15.5H7M10 12.5l-3 3 3 3"/>
    </g>
    <g id="i-help" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/>
      <path d="M9.6 9.4a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2-2.4 3.4M12 17.2h.01"/>
    </g>
  </defs>
</svg>

<div class="stage">
  <header class="topbar">
    <span class="topbar-brand">
      <svg class="ico" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="color:var(--accent)">
        <path fill="currentColor" d="M12 2.2 21.4 7.6v8.8L12 21.8 2.6 16.4V7.6z" opacity=".16"/>
        <path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" d="M12 2.2 21.4 7.6v8.8L12 21.8 2.6 16.4V7.6z"/>
        <path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" d="M12 8.4v7.2M8.9 10.2v3.6M15.1 10.2v3.6"/>
      </svg>
      CodeBee
    </span>
    <span class="topbar-sep"></span>
    <span class="topbar-title">选择工作形态</span>
    <span class="topbar-spacer"></span>
    <div class="topbar-right">
      <button class="btn btn-sm btn-ghost" type="button" id="btn-theme" title="切换明暗">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-moon"/></svg>
        <span id="theme-label">切换到暗色</span>
      </button>
      <button class="btn btn-sm btn-outline" type="button">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-settings"/></svg>
        设置
      </button>
    </div>
  </header>

  <main class="stage-main">
    <div class="intro rise">
      <div class="intro-head">
        <span class="eyebrow">
          <span class="dot dot-ok"></span>
          模型已就绪 · 4 个席位在线
        </span>
        <h1>今天想把哪件事做完？</h1>
        <p class="intro-sub">
          同一个内核，四张不同的脸。<br />选一个进去，随时能切回来 —— 任务不会中断。
        </p>
      </div>

      <div class="choice-grid">
        <button class="choice is-last" type="button" data-go="novel" title="上次进入的是这里">
          <span class="choice-top">
            <span class="choice-mark"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-book"/></svg></span>
            <span class="choice-name">
              <b>小说版</b>
              <span>写故事，读起来不像 AI</span>
            </span>
            <span class="choice-key">1</span>
          </span>
          <span class="choice-intent">我要写一本能留住读者的书</span>
          <span class="choice-what">长篇单稿 · 系列连载 · 一万字短篇 · 平台选题</span>
          <span class="choice-chips">
            <span class="tag">小说家</span>
            <span class="tag">短篇手</span>
            <span class="tag">连载家</span>
            <span class="tag">选材官</span>
          </span>
          <span class="choice-go">继续上次 <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-arrow-right"/></svg></span>
        </button>

        <button class="choice" type="button" data-go="dossier">
          <span class="choice-top">
            <span class="choice-mark"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-file-check"/></svg></span>
            <span class="choice-name">
              <b>成稿台</b>
              <span>交出去之前，先自己过一遍</span>
            </span>
            <span class="choice-key">2</span>
          </span>
          <span class="choice-intent">我要交一份不会被打回的稿子</span>
          <span class="choice-what">投标文件 · 技术方案 · 公文 · 汇报 · 简历 · 翻译</span>
          <span class="choice-chips">
            <span class="tag">标书师</span>
            <span class="tag">方案师</span>
            <span class="tag">文书</span>
            <span class="tag">汇报人</span>
            <span class="tag">+4</span>
          </span>
          <span class="choice-go">查看要件 <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-arrow-right"/></svg></span>
        </button>

        <button class="choice" type="button" data-go="workbench">
          <span class="choice-top">
            <span class="choice-mark"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-grid"/></svg></span>
            <span class="choice-name">
              <b>执行台</b>
              <span>活要真的干完，不是给建议</span>
            </span>
            <span class="choice-key">3</span>
          </span>
          <span class="choice-intent">我要它动手，跑完再告诉我</span>
          <span class="choice-what">写代码 · 修缺陷 · 跑数据 · 出报告 · 日常运维</span>
          <span class="choice-chips">
            <span class="tag">工程师</span>
            <span class="tag">快手</span>
            <span class="tag">复盘官</span>
            <span class="tag">调研员</span>
          </span>
          <span class="choice-go">打开任务 <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-arrow-right"/></svg></span>
        </button>

        <button class="choice" type="button" data-go="hive">
          <span class="choice-top">
            <span class="choice-mark"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-hive"/></svg></span>
            <span class="choice-name">
              <b>蜂群</b>
              <span>全部 21 个工种，不做收敛</span>
            </span>
            <span class="choice-key">4</span>
          </span>
          <span class="choice-intent">这些活我全都要，别替我选</span>
          <span class="choice-what">执行台 / 创作台 / 成稿台 / 分析台，四个工作台并列</span>
          <span class="choice-chips">
            <span class="tag">21 个工种</span>
            <span class="tag">18 项设置</span>
            <span class="tag">全部自动化</span>
          </span>
          <span class="choice-go">进入全量版 <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-arrow-right"/></svg></span>
        </button>
      </div>
    </div>
  </main>

  <footer class="stage-foot">
    <div class="row grow">
      <a class="foot-link" href="#">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-settings"/></svg>
        模型与渠道
      </a>
      <span>·</span>
      <a class="foot-link" href="#">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-help"/></svg>
        它怎么判断好坏
      </a>
    </div>
    <div class="row">
      <span class="kbd">1</span><span class="kbd">2</span><span class="kbd">3</span><span class="kbd">4</span>
      <span style="margin-left:2px">直选</span>
    </div>
    <span class="t-mono">v0.1.124</span>
  </footer>
</div>

<script>
  (function () {
    var root = document.documentElement;
    var btn = document.getElementById("btn-theme");
    var label = document.getElementById("theme-label");
    var icon = btn.querySelector("use");

    function apply(mode, silent) {
      root.setAttribute("data-surface", mode);
      var dark = mode === "ink";
      label.textContent = dark ? "切换到亮色" : "切换到暗色";
      icon.setAttribute("href", dark ? "#i-sun" : "#i-moon");
      if (!silent) { try { parent.postMessage({ type: "demo:surface", mode: mode }, "*"); } catch (e) {} }
    }

    // 展厅可以通过 #ink / #paper 直接指定
    apply(location.hash === "#ink" ? "ink" : "paper", true);

    btn.addEventListener("click", function () {
      apply(root.getAttribute("data-surface") === "ink" ? "paper" : "ink");
    });

    window.addEventListener("message", function (e) {
      var d = e.data || {};
      if (d.type === "demo:set-surface" && (d.mode === "ink" || d.mode === "paper")) {
        apply(d.mode, true);
      }
    });

    // 键盘 1-4 直选
    var routes = { "1": "novel", "2": "dossier", "3": "workbench", "4": "hive" };
    document.addEventListener("keydown", function (e) {
      var id = routes[e.key];
      if (!id) return;
      var el = document.querySelector('[data-go="' + id + '"]');
      if (el) el.click();
    });

    document.querySelectorAll(".choice").forEach(function (el) {
      el.addEventListener("click", function () {
        var target = el.getAttribute("data-go");
        try {
          parent.postMessage({ type: "demo:goto", page: target }, "*");
        } catch (e) {}
        // 独立打开时给一个可见反馈
        if (window.parent === window) {
          el.style.borderColor = "var(--accent)";
          setTimeout(function () { el.style.borderColor = ""; }, 700);
        }
      });
    });
  })();
</script>
</body>
</html>
