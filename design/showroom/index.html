  .shell {

    height: 100vh; height: 100dvh;
  }
  .left {
    border-right: 1px solid var(--line);
    background: var(--bg-sunken);
    display: flex; flex-direction: column;
    padding: var(--s-4) var(--s-3); gap: var(--s-1);
    overflow-y: auto;
  }
  .left h2 { font-size: var(--t-caption); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--text-3); margin: var(--s-2) var(--s-2) var(--s-2); }
  .nav {
    display: flex; flex-direction: column; gap: 2px;
  }
  .nav button {
    display: flex; align-items: center; gap: var(--s-3);
    padding: var(--s-3); border-radius: var(--r-2);
    color: var(--text-2); font-size: var(--t-small); text-align: left;
    border-left: 3px solid transparent;
    transition: background var(--dur-1), color var(--dur-1);
  }
  .nav button .ni { width: 18px; height: 18px; flex:0 0 auto; color: var(--text-3); }
  .nav button:hover { background: var(--surface-2); color: var(--text); }
  .nav button.is-on { background: var(--accent-soft); color: var(--text); border-left-color: var(--accent); }
  .nav button.is-on .ni { color: var(--accent); }
  .left-foot { margin-top: auto; padding: var(--s-3) var(--s-2); font-size: var(--t-caption); color: var(--text-3); line-height:1.5; }

  .right { display: flex; flex-direction: column; min-width: 0; }
  .top {
    display: flex; align-items: center; gap: var(--s-3);
    padding: var(--s-3) var(--s-4); border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  .top .title { font-size: var(--t-small); font-weight: var(--w-semi); }
  .top .meta { font-size: var(--t-caption); color: var(--text-3); }
  .frame-wrap {
    flex: 1 1 auto; min-height: 0; overflow: auto;
    background: var(--bg-sunken);
    display: flex; justify-content: center; align-items: flex-start;
    padding: var(--s-6);
  }
  .frame-edge {
    background: var(--surface);
    border: 1px solid var(--line-2);
    border-radius: var(--r-4);
    overflow: hidden;
    box-shadow: var(--sh-pop);
    transition: width var(--dur-3) var(--ease-in-out), height var(--dur-3) var(--ease-in-out);
    width: 100%; height: 100%;
  }

  .frame-edge.w-1440 { width: 1440px; max-width: 100%; height: calc(100vh - 150px); }
  .frame-edge.w-1024 { width: 1024px; max-width: 100%; height: 768px; }
  .frame-edge.w-390 { width: 390px; height: 780px; }

<script>
  const root = document.documentElement;
  const frame = document.getElementById('frame');
  const edge = document.getElementById('edge');
  const nav = document.getElementById('nav');
  let surface = 'ink';
  let userToggled = false;

  // 同步明暗到 iframe（仅用户手动切换后才统一覆盖页面默认）
  function syncSurface() {
    if (userToggled) frame.contentWindow.postMessage({ surface }, '*');
  }
  document.getElementById('tt').addEventListener('click', () => {
    userToggled = true;
    surface = root.getAttribute('data-surface') === 'ink' ? 'paper' : 'ink';
    root.setAttribute('data-surface', surface);
    document.getElementById('ttI').innerHTML = surface === 'ink' ? '<use href="#i-sun"/>' : '<use href="#i-moon"/>';
    syncSurface();
  });

  // 切换视图
  nav.addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    nav.querySelectorAll('button').forEach(b => b.classList.remove('is-on'));
    btn.classList.add('is-on');
    const page = btn.dataset.page;
    document.getElementById('ptitle').textContent = btn.dataset.name;
    document.getElementById('pmeta').textContent = 'pages/' + page + '.html';
    document.getElementById('openLink').href = 'pages/' + page + '.html';
    frame.src = 'pages/' + page + '.html';
    frame.onload = syncSurface;
  });

  // 切换宽度
  document.getElementById('widthSeg').addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    document.querySelectorAll('#widthSeg button').forEach(b => b.classList.remove('is-on'));
    btn.classList.add('is-on');
    edge.className = 'frame-edge w-' + btn.dataset.w;
  });
</script>
