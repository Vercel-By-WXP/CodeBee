<!DOCTYPE html>
<html lang="zh-CN" data-lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CodeBee</title>
<link rel="icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/board.css">
</head>
<body>

<!-- 远程访问令牌门（本机免输；与主界面共用 orch.token） -->
<div id="gate" class="gate hidden">
  <div class="gate-box">
    <div class="gate-title" data-i18n="需要访问令牌">需要访问令牌</div>
    <div class="gate-sub" data-i18n="启动 CodeBee 时控制台会显示">启动 CodeBee 时控制台会显示</div>
    <input id="gate-token" type="password" data-i18n-ph="访问令牌" placeholder="访问令牌" autocomplete="off">
    <button id="gate-ok" data-i18n="进入大屏">进入大屏</button>
    <div id="gate-err" class="gate-err"></div>
  </div>
</div>

<header id="hd">
  <div class="hd-brand">
    <div class="hd-name">CodeBee</div>
  </div>
  <div class="hd-right">
    <div id="hd-pool" class="hd-pill" title="执行池占用">—</div>
    <div id="hd-health" class="hd-pill warn hidden" title=""></div>
    <div id="hd-conn" class="hd-pill off hidden" data-i18n="连接断开">连接断开</div>
    <div id="hd-clock" class="hd-clock">--:--:--</div>
  </div>
</header>

<section id="kpis">
  <div class="kpi k-run"><div class="k-num" id="k-running">0</div><div class="k-label" data-i18n="运行中">运行中</div></div>
  <div class="kpi k-queue"><div class="k-num" id="k-queued">0</div><div class="k-label" data-i18n="排队中">排队中</div></div>
  <div class="kpi k-done"><div class="k-num" id="k-done">0</div><div class="k-label" data-i18n="今日完成">今日完成</div></div>
  <div class="kpi k-fail"><div class="k-num" id="k-failed">0</div><div class="k-label" data-i18n="今日失败">今日失败</div></div>
  <div class="kpi k-tok"><div class="k-num" id="k-tokens">0</div><div class="k-label" data-i18n="今日 tokens">今日 tokens</div></div>
  <div class="kpi k-cost"><div class="k-num" id="k-cost">$0.00</div><div class="k-label" data-i18n="今日成本">今日成本</div></div>
</section>

<main id="main">
  <section id="wall">
    <div class="sec-title" data-i18n="运行中任务">运行中任务</div>
    <div id="wall-cards"></div>
    <div id="wall-empty" class="wall-empty hidden">
      <svg viewBox="0 0 48 48" class="idle-bee" aria-hidden="true">
        <ellipse cx="24" cy="28" rx="13" ry="16" fill="#3a4a68"/>
        <path d="M11 22h26M11 30h26M13 38h22" stroke="#0d1626" stroke-width="5" stroke-linecap="round"/>
        <ellipse cx="13" cy="12" rx="9" ry="6" fill="#2a3a58" opacity=".8"/>
        <ellipse cx="35" cy="12" rx="9" ry="6" fill="#2a3a58" opacity=".8"/>
        <circle cx="24" cy="11" r="6" fill="#0d1626"/>
      </svg>
      <div class="idle-t1" data-i18n="蜂巢空闲 · 等蜂回巢">蜂巢空闲 · 等蜂回巢</div>
      <div class="idle-t2" data-i18n="没有正在运行的任务，新任务在主界面创建后会实时出现在这里">没有正在运行的任务，新任务在主界面创建后会实时出现在这里</div>
    </div>
    <div id="queue-row" class="queue-row hidden">
      <span class="q-label" data-i18n="排队等待">排队等待</span>
      <span id="queue-chips"></span>
    </div>
  </section>

  <aside id="rail">
    <div class="rail-card">
      <div class="sec-title" data-i18n="近 7 日 tokens">近 7 日 tokens</div>
      <div id="trend" class="trend"></div>
    </div>
    <div class="rail-card">
      <div class="sec-title" data-i18n="近 7 日模型 TOP5">近 7 日模型 TOP5</div>
      <div id="models" class="models"></div>
    </div>
    <div class="rail-card grow">
      <div class="sec-title" data-i18n="最近动态">最近动态</div>
      <div id="recent" class="recent"></div>
    </div>
  </aside>
</main>

<script src="/i18n.js"></script>
<script src="/board.js"></script>
</body>
</html>
