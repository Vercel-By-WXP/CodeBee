<!DOCTYPE html>
<html lang="zh-CN" data-lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CodeBee · 任务驾驶舱</title>
<link rel="icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/board.css">
</head>
<body>

<!-- 远程访问令牌门（本机免输；与主界面共用 orch.token） -->
<div id="gate" class="gate hidden">
  <div class="gate-box">
    <div class="gate-title" data-i18n="需要访问令牌">需要访问令牌</div>
    <div class="gate-sub" data-i18n="启动 CodeBee 时控制台会显示">启动 CodeBee 时控制台会显示</div>
    <input id="gate-token" type="password" data-i18n-ph="访问令牌" placeholder="访问令牌" autocomplete="off">
    <button id="gate-ok" type="button" data-i18n="进入大屏">进入大屏</button>
    <div id="gate-err" class="gate-err"></div>
  </div>
</div>

<header id="hd">
  <div class="hd-brand"><div class="hd-name">CodeBee</div></div>

  <div class="hd-state" id="hd-state">
    <span class="state-pip" aria-hidden="true"></span>
    <span class="state-text" id="hd-state-text" data-i18n="蜂群待命">蜂群待命</span>
    <span class="hd-sep" aria-hidden="true"></span>
    <span class="hd-sync" id="hd-updated" data-i18n="同步中">同步中</span>
  </div>

  <div class="hd-right">
    <div class="hd-metric" data-i18n-title="执行池占用">
      <em data-i18n="蜂巢">蜂巢</em><b id="hd-pool-alive">0</b><span id="hd-pool-target">/0</span>
    </div>
    <div class="hd-metric">
      <em data-i18n="对话">对话</em><b id="hd-chat-alive">0</b><span id="hd-chat-pool">/0</span>
    </div>
    <div class="hd-svc" id="hd-health"><i aria-hidden="true"></i><span id="hd-health-text"></span></div>
    <div id="hd-conn" class="hd-off hidden" data-i18n="连接断开">连接断开</div>
    <div class="hd-swap">
      <button class="sw-btn" id="sw-skin" type="button" data-i18n-title="切换皮肤（仅大屏记忆）"><span data-i18n="皮肤">皮肤</span> <b id="sw-skin-n">—</b></button>
      <button class="sw-btn" id="sw-mode" type="button" data-i18n-title="切换明暗（仅大屏记忆）"><b id="sw-mode-n">—</b></button>
    </div>
    <div id="hd-clock" class="hd-clock">--:--:--</div>
  </div>
</header>

<main id="board">

  <section id="kpis" aria-label="核心指标" data-i18n-aria="核心指标">
    <div class="kpi k-run">
      <span class="k-lab" data-i18n="运行中">运行中</span>
      <div class="k-row"><b class="k-num" id="k-running">0</b><span class="k-sub" id="k-run-sub">—</span></div>
    </div>
    <div class="kpi k-queue">
      <span class="k-lab" data-i18n="排队中">排队中</span>
      <div class="k-row"><b class="k-num" id="k-queued">0</b><span class="k-sub" id="k-queue-sub">—</span></div>
    </div>
    <div class="kpi k-done">
      <span class="k-lab" data-i18n="今日完成">今日完成</span>
      <div class="k-row"><b class="k-num" id="k-done">0</b><span class="k-sub" id="k-done-sub">—</span></div>
      <span class="k-ratio" aria-hidden="true"><i id="k-ratio-fill"></i></span>
    </div>
    <div class="kpi k-fail">
      <span class="k-lab" data-i18n="今日失败">今日失败</span>
      <div class="k-row"><b class="k-num" id="k-failed">0</b><span class="k-sub" id="k-fail-sub">—</span></div>
    </div>
    <div class="kpi k-use">
      <span class="k-lab" data-i18n="今日消耗">今日消耗</span>
      <div class="k-row"><b class="k-num" id="k-tokens">0</b><span class="k-sub" id="k-use-sub">—</span></div>
    </div>
  </section>

  <section id="main">
    <section id="wall" class="panel">
      <header class="p-head">
        <h2 data-i18n="运行中任务">运行中任务</h2>
        <div class="p-head-right">
          <span id="wall-count" class="p-badge">0</span>
          <span class="p-note" data-i18n="每 4 秒刷新">每 4 秒刷新</span>
        </div>
      </header>

      <div id="wall-cards" class="wall-grid"></div>

      <div id="wall-empty" class="wall-empty hidden">
        <div class="idle-head">
          <div class="idle-ring" aria-hidden="true"><i></i></div>
          <div>
            <div class="idle-t1" data-i18n="队列已清空">队列已清空</div>
            <div class="idle-t2" data-i18n="新任务在主界面创建后会实时出现在这里">新任务在主界面创建后会实时出现在这里</div>
          </div>
        </div>
        <div class="idle-list">
          <div class="idle-cap"><span data-i18n="今日运行">今日运行</span> · <span id="idle-count">0</span> <span data-i18n="条">条</span></div>
          <div id="idle-rows"></div>
        </div>
      </div>

      <div id="queue-row" class="queue-row hidden">
        <div class="q-label"><span data-i18n="排队等待">排队等待</span><b id="queue-count">0</b></div>
        <span id="queue-chips"></span>
      </div>
    </section>

    <aside id="rail">
      <section class="rc rc-pool panel">
        <div class="rc-head"><h3 data-i18n="执行池">执行池</h3><span class="rc-badge" id="pool-mode">—</span></div>
        <div class="meter">
          <div class="meter-top"><span data-i18n="蜂巢槽位">蜂巢槽位</span><b><i id="pool-alive">0</i>/<span id="pool-target">0</span></b></div>
          <div class="meter-bar"><i id="pool-meter-fill"></i></div>
        </div>
        <div class="meter">
          <div class="meter-top"><span data-i18n="对话槽位">对话槽位</span><b><i id="chat-alive">0</i>/<span id="chat-pool">0</span></b></div>
          <div class="meter-bar cool"><i id="chat-meter-fill"></i></div>
        </div>
        <div class="pool-foot"><span data-i18n="空闲槽位">空闲槽位</span><b id="pool-available">0</b></div>
      </section>

      <section class="rc rc-trend panel">
        <div class="rc-head"><h3 data-i18n="近 7 日 tokens">近 7 日 tokens</h3><span class="rc-badge" id="trend-total">—</span></div>
        <div id="trend" class="trend"></div>
      </section>

      <section class="rc rc-models panel">
        <div class="rc-head"><h3 data-i18n="近 7 日模型 TOP5">近 7 日模型 TOP5</h3><span class="rc-badge">TOP 5</span></div>
        <div id="models" class="models"></div>
      </section>

      <section class="rc rc-recent panel">
        <div class="rc-head"><h3 data-i18n="最近动态">最近动态</h3><span id="recent-count" class="rc-badge">—</span></div>
        <div id="recent" class="recent"></div>
      </section>
    </aside>
  </section>

</main>

<!-- 点运行卡下钻：步骤链取 /api/board/run，日志窗复用现成的 /api/runs/<id>/log -->
<div id="scrim"></div>
<aside id="drawer" aria-hidden="true">
  <div class="dw-head">
    <div class="dw-top">
      <span class="c-type" id="dw-type"></span>
      <h4 id="dw-title"></h4>
      <button class="dw-close" id="dw-close" type="button" data-i18n-title="关闭 (Esc)">✕</button>
    </div>
    <p class="dw-goal" id="dw-goal"></p>
    <div class="dw-meta" id="dw-meta"></div>
  </div>
  <div class="dw-body">
    <div class="dw-steps" id="dw-steps"></div>
    <div class="dw-log">
      <div class="dw-log-head"><span class="tag" id="dw-log-tag" data-i18n="步骤日志">步骤日志</span><span id="dw-log-sub"></span></div>
      <div class="dw-log-body" id="dw-log-body"></div>
    </div>
  </div>
</aside>

<script src="/i18n.js"></script>
<script src="/board.js"></script>
</body>
</html>
