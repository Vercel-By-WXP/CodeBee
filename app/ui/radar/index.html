<!doctype html>
<html lang="zh-CN" data-surface="paper" data-density="comfy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>分析洞察 · CodeBee</title>
<link rel="stylesheet" href="/v2/foundation.css">
<link rel="stylesheet" href="/v2/base.css">
<link rel="stylesheet" href="/v2/components.css">
<style>
  /* 页面专属：只写布局。颜色/字号/圆角全部来自 v2 三件套。 */
  body {
    background-image: radial-gradient(
      720px 420px at 86% -8%,
      var(--halo), transparent 62%
    );
    background-repeat: no-repeat;
  }
  .wrap { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
  .top {
    display: flex; align-items: center; justify-content: space-between;
    padding: var(--s-4) var(--s-8);
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: var(--z-sticky);
    background: var(--bg);
  }
  .top-links { display: flex; align-items: center; gap: var(--s-2); }

  main { flex: 1; width: 100%; max-width: 1120px; margin: 0 auto; padding: var(--s-6) var(--s-6) var(--s-12); }
  .flowbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: var(--s-2); padding: var(--s-3) var(--s-4);
    border: 1px solid var(--line); border-radius: var(--r-3);
    background: var(--surface); margin-bottom: var(--s-6);
  }
  .kpi-row {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: var(--s-3); margin-bottom: var(--s-6);
  }
  .kpi {
    border: 1px solid var(--line); border-radius: var(--r-3);
    background: var(--surface); padding: var(--s-4);
  }
  .kpi .k-label { font-size: var(--t-caption); color: var(--text-2); }
  .kpi .k-num {
    margin-top: var(--s-1); font-size: var(--t-h2); font-weight: var(--w-bold);
    color: var(--text); font-variant-numeric: tabular-nums; letter-spacing: var(--tracking-tight);
  }
  .kpi .k-sub { margin-top: 2px; font-size: var(--t-caption); color: var(--text-3); }
  .kpi .k-num.is-good { color: var(--ok); }
  .kpi .k-num.is-bad { color: var(--bad); }

  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-4); align-items: start; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
  .panel-card {
    border: 1px solid var(--line); border-radius: var(--r-3);
    background: var(--surface);
  }
  .panel-card .pc-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: var(--s-3) var(--s-4); border-bottom: 1px solid var(--line);
  }
  .panel-card .pc-title { font-size: var(--t-body); font-weight: var(--w-semi); color: var(--text); }
  .seg { display: flex; gap: 2px; }
  .seg button {
    border: 1px solid transparent; background: transparent; color: var(--text-2);
    font-size: var(--t-caption); padding: 3px 10px; border-radius: var(--r-2); cursor: pointer;
    font-family: inherit;
  }
  .seg button.is-on { background: var(--accent-soft); color: var(--accent); font-weight: var(--w-medium); }
  .pc-body { padding: var(--s-2) var(--s-2); }

  .row {
    display: flex; align-items: center; gap: var(--s-3);
    padding: var(--s-2) var(--s-3); border-radius: var(--r-2);
  }
  .row:hover { background: var(--surface-2); }
  .row .r-main { min-width: 0; flex: 1; }
  .row .r-title { font-size: var(--t-small); color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .r-sub { margin-top: 1px; font-size: var(--t-caption); color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .r-when { font-size: var(--t-caption); color: var(--text-3); flex: none; font-variant-numeric: tabular-nums; }

  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--text-3); }
  .dot.is-ok { background: var(--ok); }
  .dot.is-bad { background: var(--bad); }
  .dot.is-run { background: var(--accent); }

  .soon {
    padding: var(--s-5) var(--s-4); text-align: center;
  }
  .soon .s-title { font-size: var(--t-body); color: var(--text-2); font-weight: var(--w-medium); }
  .soon .s-body { margin-top: var(--s-1); font-size: var(--t-caption); color: var(--text-3); }

  .foot {
    padding: var(--s-4) var(--s-8); border-top: 1px solid var(--line);
    display: flex; justify-content: space-between;
    font-size: var(--t-caption); color: var(--text-3);
  }
  .err { padding: var(--s-2) var(--s-3); font-size: var(--t-caption); color: var(--bad); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-hive" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.5l7 4v9l-7 4-7-4v-9z" opacity=".18"/><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" d="M12 2.5l7 4v9l-7 4-7-4v-9z"/><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" d="M5 6.5l7 4 7-4M12 10.5V21"/></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M4 20l4-1 10-10-3-3L5 16l-1 4zM14 6l3 3"/></symbol>
    <symbol id="i-doc" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" d="M7 3h7l4 4v14H7zM14 3v4h4"/><path fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" d="M9.5 12h6M9.5 15h6M9.5 18h4"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M13 6l6 6-6 6"/></symbol>
  </defs>
</svg>

<div class="wrap">
  <header class="top">
    <span class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24"><use href="#i-hive"/></svg>
      <span class="brand-name">CodeBee · 分析洞察</span>
    </span>
    <nav class="top-links">
      <a class="btn btn-ghost btn-sm" href="/novel/">创作台</a>
      <a class="btn btn-ghost btn-sm" href="/dossier/">成稿台</a>
      <a class="btn btn-outline btn-sm" href="/welcome/">切换</a>
    </nav>
  </header>

  <main>
    <div class="flowbar pipeline" aria-label="分析流程">
      <span class="step"><span class="n">1</span>榜单扫描</span>
      <span class="arrow">→</span>
      <span class="step"><span class="n">2</span>选题拆解</span>
      <span class="arrow">→</span>
      <span class="step"><span class="n">3</span>竞品矩阵</span>
      <span class="arrow">→</span>
      <span class="step is-on"><span class="n">4</span>数据透视</span>
    </div>

    <div class="kpi-row" id="kpis"></div>

    <div class="cols">
      <section class="panel-card">
        <div class="pc-head">
          <span class="pc-title">最近发布失败</span>
          <span class="seg" id="days-seg">
            <button type="button" data-days="7" class="is-on">近 7 天</button>
            <button type="button" data-days="30">近 30 天</button>
          </span>
        </div>
        <div class="pc-body" id="failures"></div>
      </section>

      <section class="panel-card">
        <div class="pc-head"><span class="pc-title">最近运行</span></div>
        <div class="pc-body" id="runs"></div>
      </section>

      <section class="panel-card">
        <div class="soon">
          <p class="s-title">榜单概览 / 选题拆解 / 竞品矩阵</p>
          <p class="s-body">随后端开放——把榜单扫描跑进编排台后，这里直接吃它的产出。</p>
        </div>
      </section>
    </div>
  </main>

  <footer class="foot">
    <span>CodeBee · 分析洞察</span>
    <span>本机优先，数据不出机器</span>
  </footer>
</div>

<script src="radar.js"></script>
</body>
</html>
