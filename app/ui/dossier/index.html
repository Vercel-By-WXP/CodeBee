<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>成稿台 · CodeBee</title>
<link rel="stylesheet" href="/dossier/dossier.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="#/" id="brand-link">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 3.5h8.5L19 8v12.5H6z"/>
        <path d="M14 3.5V8h5"/>
        <path d="M9 12h7M9 15.5h7M9 8.5h3"/>
      </svg>
    </span>
    <span id="brand-name">成稿台</span>
  </a>
  <div class="topbar-right">
    <span id="conn-dot" class="conn-dot" title="正在连接"></span>
    <a class="btn btn-switch" href="/welcome/" title="换一个产品形态">切换</a>
    <button id="btn-refresh" class="btn btn-ghost" type="button">刷新</button>
  </div>
</header>

<div class="shell">

  <aside class="rail" aria-label="文档">
    <div class="rail-head">
      <p class="rail-title">文档</p>
      <p class="rail-sub" id="rail-sub">按时间倒序</p>
    </div>
    <nav id="rail-list" class="rail-list"></nav>
    <p class="rail-foot">只查要件与结构，不改正文。</p>
  </aside>

  <main class="stage">

    <section id="view-empty" class="view empty-view">
      <div class="empty">
        <p class="empty-title">还没有文档类任务</p>
        <p class="empty-sub">在标书、文档或技术方案专家那里开一个任务；写完稿后回到这里逐条核对要件。</p>
      </div>
    </section>

    <section id="view-doc" class="view hidden">
      <div class="doc-head">
        <div class="doc-titles">
          <p class="doc-kind" id="doc-flow">—</p>
          <h1 id="doc-title">—</h1>
          <p class="doc-meta">
            <span id="doc-status"></span>
            <span id="doc-words"></span>
            <span id="doc-file" class="mono"></span>
          </p>
        </div>
        <button id="btn-export" class="btn btn-primary" type="button">导出定稿</button>
      </div>

      <div id="summary" class="summary"></div>

      <div class="grid">
        <div class="panel tree-panel">
          <div class="panel-head">
            <p class="panel-title">章节树</p>
            <p class="panel-note" id="tree-note"></p>
          </div>
          <div id="tree" class="tree"></div>
        </div>

        <div class="panel check-panel">
          <div class="panel-head">
            <p class="panel-title">要件核对</p>
            <p class="panel-note" id="check-note"></p>
          </div>
          <div id="checklist" class="checklist"></div>
        </div>
      </div>
    </section>

  </main>
</div>

<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<script src="/dossier/dossier.js"></script>
</body>
</html>
