<body><p><a href="/">CodeBee</a></p><h1>反馈与预览版问卷</h1><p>当前桌面安装包为预览版。请在 GitHub Issue 中脱敏后附上版本、系统、CLI 版本、复现步骤和日志位置。</p><p><a href="https://github.com/Vercel-By-WXP/CodeBee/issues/new/choose">提交 Issue</a> · <a href="https://github.com/Vercel-By-WXP/CodeBee/discussions">参与讨论</a></p><h2>问卷（可选）</h2><ol><li>你主要用 CodeBee 解决什么类型的任务？</li><li>你同时安装了哪些 AI CLI？</li><li>最容易卡住或不清楚的步骤是什么？</li><li>你希望优先改进路由、评审、报告还是桌面体验？</li><li>是否愿意参与下一轮预览验收？</li></ol><p>当前没有内置追踪器；匿名统计必须明示同意且可随时关闭，正式接入前需确认数据处理和存储地点【需确认】。</p></body></html>
