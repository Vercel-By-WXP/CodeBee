<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f4ee">
  <title>Codebee · 连接我的电脑</title>
  <link rel="stylesheet" href="/relay/portal.css">
  <script defer src="/relay/portal.js"></script>
</head>
<body>
  <main>
    <a class="brand" href="https://codebeeagent.com"><img class="mark" src="/relay/codebee-logo.png" alt="CodeBee">CodeBee</a>
    <div class="eyebrow"><span class="dot"></span>你的工作台，随身连接</div>
    <h1>连接我的电脑<span>继续你的工作。</span></h1>
    <p class="intro">在手机上查看任务、回复 Agent、接管 Codebee。<br>所有任务继续在你自己的电脑上执行。</p>
    <section class="card" aria-labelledby="pair-title">
      <div class="step">01 / 配对你的设备</div>
      <h2 id="pair-title">从电脑开始，手机接续。</h2>
      <p>在电脑的 CodeBee 中打开「手机连接」，点击「生成配对码」，用手机扫描二维码，或直接打开电脑复制的链接。</p>
      <p class="auto">链接会自动完成配对并进入你自己的 CodeBee，无需手动输入连接码。</p>
      <p id="status" role="status" aria-live="polite"></p>
      <div class="paired" id="paired" hidden><a href="/">进入已配对的工作台 ↗</a><button type="button" id="logout">忘记此电脑</button></div>
    </section>
    <div class="notes"><span>一次配对，只连接你的电脑。</span><span>电脑保持开机，Codebee 保持运行。</span></div>
    <footer>Codebee <span>·</span> Your agents. Your computer.</footer>
  </main>
</body>
</html>
