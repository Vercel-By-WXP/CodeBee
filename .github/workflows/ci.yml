name: Python CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  PYTHONPATH: ${{ github.workspace }}/scripts/production_guard

jobs:
  syntax-check:
    name: Syntax check (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile all Python files
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import py_compile
          files = [
              path for path in pathlib.Path(".").rglob("*.py")
              if ".git" not in path.parts and "__pycache__" not in path.parts
          ]
          for path in files:
              py_compile.compile(str(path), doraise=True)
          print("compiled", len(files), "Python files")
          PY

  dependency-scan:
    name: Standard-library dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reject unexpected third-party imports
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import pathlib
          import sys

          stdlib = set(getattr(sys, "stdlib_module_names", ()))
          stdlib.update({"__future__"})
          roots = {"app", "tools", "scripts", "sitecustomize"}
          for package in (pathlib.Path("app"), pathlib.Path("tools"),
                          pathlib.Path("scripts")):
              if not package.is_dir():
                  continue
              roots.update(path.name for path in package.iterdir()
                           if path.is_dir())
              roots.update(path.stem for path in package.glob("*.py"))
          optional_imports = {
              "PIL", "certifi", "chinese_calendar", "numpy", "playwright",
              "psutil", "wechatauto", "yaml",
          }
          third_party = []
          for path in pathlib.Path(".").rglob("*.py"):
              if ".git" in path.parts or "__pycache__" in path.parts:
                  continue
              try:
                  tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              except (OSError, SyntaxError):
                  continue
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      names = [item.name.split(".")[0] for item in node.names]
                  elif (isinstance(node, ast.ImportFrom) and node.module
                        and node.level == 0):
                      names = [node.module.split(".")[0]]
                  else:
                      continue
                  for name in names:
                      if (name not in stdlib and name not in roots
                              and name not in optional_imports):
                          third_party.append(f"{path}: {name}")
          if third_party:
              print("Unexpected imports:")
              print("\n".join(sorted(set(third_party))))
              raise SystemExit(1)
          print("No unexpected third-party imports found")
          PY
