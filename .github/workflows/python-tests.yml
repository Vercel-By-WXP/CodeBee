name: Python tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bubblewrap runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
      - name: Run unit and sandbox integration tests
        run: python -m unittest discover -s tests -v
