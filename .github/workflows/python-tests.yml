name: Python checks

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  PYTHONPATH: ${{ github.workspace }}/scripts/production_guard

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install developer static-analysis tools
        run: python -m pip install --disable-pip-version-check --requirement requirements-dev.txt
      - name: Reject newly introduced static diagnostics
        run: python tools/static_check.py

  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install bubblewrap runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
      - name: Run official npm release gate (without publishing)
        run: python scripts/release_gate.py
