name: Mirror to Gitee

on:
  push:
    branches: ["*"]
    tags: ["*"]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: yesolutions/mirror-action@master
        with:
          remote: "https://gitee.com/${{ secrets.GITEE_OWNER }}/${{ secrets.GITEE_REPO }}.git"
          git_push_username: ${{ secrets.GITEE_USERNAME }}
          git_push_password: ${{ secrets.GITEE_TOKEN }}
