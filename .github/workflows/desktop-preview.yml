name: Desktop preview

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'app/desktop_host.py'
      - 'app/core/runtime_lock.py'
      - 'app/main.py'
      - '.github/workflows/desktop-preview.yml'

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-preview:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
            dist: dist:win
          - os: macos-15
            platform: darwin
            arch: arm64
            dist: dist:mac:arm64
          - os: macos-15-intel
            platform: darwin
            arch: x64
            dist: dist:mac:x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      TUTTI_SELFUPDATE_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Run sidecar lifecycle and data lock tests
        working-directory: .
        run: python -m unittest discover -s tests -p test_desktop_runtime.py -v -f
      - run: npm run prepare:runtime -- ${{ matrix.platform }} ${{ matrix.arch }}
      - name: Desktop smoke with bundled Python
        run: npm run smoke
      - name: Build preview installer (no publishing)
        run: npm run ${{ matrix.dist }}
      - name: Test the packaged application
        shell: bash
        env:
          CODEBEE_SMOKE_OUTPUT: ${{ github.workspace }}/desktop/dist/packaged-smoke
        run: |
          if [ "${{ matrix.platform }}" = win32 ]; then
            './dist/win-unpacked/CodeBee.exe' --smoke-test
          else
            if [ "${{ matrix.arch }}" = arm64 ]; then
              './dist/mac-arm64/CodeBee.app/Contents/MacOS/CodeBee' --smoke-test
            else
              './dist/mac/CodeBee.app/Contents/MacOS/CodeBee' --smoke-test
            fi
          fi
          test -f dist/packaged-smoke/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codebee-preview-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/smoke/
            desktop/dist/packaged-smoke/
          if-no-files-found: warn

  win7-preview:
    # Windows 7 target: Electron 22.3.27 (last line supporting Win7/8/8.1) with
    # the Python 3.8 embeddable runtime; electron-builder.win7.yml pins the
    # electron version via `electronVersion`, and before-pack enforces the
    # matching win7 Python profile. The packaged smoke runs on the Win10/11
    # runner to prove the Electron 22 build itself works end to end.
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      TUTTI_SELFUPDATE_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Run sidecar lifecycle and data lock tests
        working-directory: .
        run: python -m unittest discover -s tests -p test_desktop_runtime.py -v -f
      - name: Build Windows 7 preview installer
        run: npm run dist:win7
      - name: Test the packaged application (Electron 22)
        shell: bash
        env:
          CODEBEE_SMOKE_OUTPUT: ${{ github.workspace }}/desktop/dist/packaged-smoke-win7
        run: |
          './dist/win-unpacked/CodeBee.exe' --smoke-test
          test -f dist/packaged-smoke-win7/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codebee-preview-win7-x64
          path: |
            desktop/dist/*win7*.exe
            desktop/dist/packaged-smoke-win7/
          if-no-files-found: warn
