name: Desktop preview

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'desktop/**'
      - 'app/**'
      - '.github/workflows/desktop-preview.yml'

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-preview:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 钉老镜像：windows-latest 随镜像滚动换 GPU 驱动栈，Electron 的
          # GPU 进程在其上 0xC0000005 必崩（2026-10-25 v0.1.121 三连败实案，
          # --disable-gpu 也拦不住 Viz 架构拉起 GPU 进程）；windows-2022
          # 驱动栈为 Electron 已验证稳定组合。
          - os: windows-2022
            platform: win32
            arch: x64
            dist: dist:win
          - os: macos-15
            platform: darwin
            arch: arm64
            dist: dist:mac:arm64
          - os: macos-15-intel
            platform: darwin
            arch: x64
            dist: dist:mac:x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      TUTTI_SELFUPDATE_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Verify single version source
        working-directory: .
        run: python scripts/sync_version.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2 patchelf rpm
      - run: npm ci --no-audit --no-fund
      - name: Prepare bundled Python runtime
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = win32 ]; then
            npm run prepare:runtime:win
          elif [ "${{ matrix.platform }}" = linux ]; then
            npm run prepare:runtime:linux
          else
            npm run prepare:runtime -- ${{ matrix.platform }} ${{ matrix.arch }}
          fi
      - name: Desktop smoke with bundled Python
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = linux ]; then
            # Linux headless runner: Electron needs a virtual X display
            sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
            xvfb-run --auto-servernum npm run smoke
          else
            npm run smoke
          fi
      - name: Build preview installer with strict NSIS warnings (no publishing)
        run: npm run ${{ matrix.dist }}
      - name: Test the packaged application
        shell: bash
        env:
          CODEBEE_SMOKE_OUTPUT: ${{ github.workspace }}/desktop/dist/packaged-smoke
        run: |
          if [ "${{ matrix.platform }}" = win32 ]; then
            './dist/win-unpacked/CodeBee.exe' --smoke-test
          elif [ "${{ matrix.arch }}" = arm64 ]; then
            './dist/mac-arm64/CodeBee.app/Contents/MacOS/CodeBee' --smoke-test
          elif [ "${{ matrix.platform }}" = linux ]; then
            sudo apt-get install -y -qq xvfb
            xvfb-run --auto-servernum './dist/linux-unpacked/CodeBee' --smoke-test
          else
            './dist/mac/CodeBee.app/Contents/MacOS/CodeBee' --smoke-test
          fi
          test -f dist/packaged-smoke/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codebee-preview-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.rpm
            desktop/dist/smoke/
            desktop/dist/packaged-smoke/
          if-no-files-found: warn

  github-release:
    # Tag push (v*) = 正式发版：兼容 Windows 与 macOS universal 构建全绿后自动创建 GitHub Release，
    # 把兼容安装包挂到 Releases 页（公开仓库无需登录即可下载）。
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [native-preview]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect installers, checksums, and build manifest
        run: node scripts/collect_desktop_release.mjs --input artifacts --output release --tag "${{ github.ref_name }}"
      - name: Generate release notes from CHANGELOG
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["RELEASE_TAG"].removeprefix("v")
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          heading = f"## v{version}"
          try:
              start = next(i for i, line in enumerate(lines) if line.startswith(heading))
          except StopIteration as exc:
              raise SystemExit(f"CHANGELOG.md has no section for v{version}") from exc
          end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith("## ")), len(lines))
          section = "\n".join(lines[start:end]).strip()
          Path("release/RELEASE_NOTES.md").write_text(
              "桌面预览版（安装包未必已签名/公证，请以本次发布状态为准）。\n\n"
              + section
              + "\n\n校验和见 `SHA256SUMS.txt` 与 `SHA512SUMS.txt`。问题反馈："
              + " https://github.com/Vercel-By-WXP/CodeBee/issues\n",
              encoding="utf-8",
          )
          PY
      - name: Verify release contract
        working-directory: release
        run: |
          test -s SHA512SUMS.txt
          test -s SHA256SUMS.txt
          test -s desktop-builds.json
          test -s build-record.json
          test -s RELEASE_NOTES.md
          # SUMS 里是裸文件名，校验必须在 release/ 目录内跑——
          # 在仓库根跑会全部 "FAILED open or read"（v0.1.120 实案）
          sha512sum -c SHA512SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Create GitHub Release with installers and records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "CodeBee ${GITHUB_REF_NAME#v}" \
            --notes-file release/RELEASE_NOTES.md \
            --prerelease \
            release/*
