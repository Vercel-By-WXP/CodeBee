name: Desktop preview

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'desktop/**'
      - 'app/**'
      - '.github/workflows/desktop-preview.yml'

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-preview:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
            dist: dist:win
          - os: macos-15
            platform: darwin
            arch: arm64
            dist: dist:mac:arm64
          - os: macos-15-intel
            platform: darwin
            arch: x64
            dist: dist:mac:x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      TUTTI_SELFUPDATE_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Run sidecar lifecycle and data lock tests
        working-directory: .
        run: python -m unittest discover -s tests -p test_desktop_runtime.py -v -f
      - name: Prepare bundled Python runtime
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = win32 ]; then
            npm run prepare:runtime:win
          else
            npm run prepare:runtime -- ${{ matrix.platform }} ${{ matrix.arch }}
          fi
      - name: Desktop smoke with bundled Python
        run: npm run smoke
      - name: Build preview installer (no publishing)
        run: npm run ${{ matrix.dist }}
      - name: Test the packaged application
        shell: bash
        env:
          CODEBEE_SMOKE_OUTPUT: ${{ github.workspace }}/desktop/dist/packaged-smoke
        run: |
          if [ "${{ matrix.platform }}" = win32 ]; then
            './dist/win-unpacked/CodeBee.exe' --smoke-test
          elif [ "${{ matrix.arch }}" = arm64 ]; then
            './dist/mac-arm64/CodeBee.app/Contents/MacOS/CodeBee' --smoke-test
          else
            './dist/mac/CodeBee.app/Contents/MacOS/CodeBee' --smoke-test
          fi
          test -f dist/packaged-smoke/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codebee-preview-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/smoke/
            desktop/dist/packaged-smoke/
          if-no-files-found: warn

  github-release:
    # Tag push (v*) = 正式发版：兼容 Windows 与 macOS universal 构建全绿后自动创建 GitHub Release，
    # 把兼容安装包挂到 Releases 页（公开仓库无需登录即可下载）。
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [native-preview]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect installers
        run: |
          mkdir -p release
          find artifacts -name '*.exe' -exec mv {} release/ \;
          find artifacts \( -name '*.dmg' -o -name '*.zip' \) -exec mv {} release/ \;
          ls -la release/
      - name: Create GitHub Release with installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "CodeBee ${GITHUB_REF_NAME#v}" \
            --notes "桌面预览版兼容安装包（Windows 7/8.1/10/11 x64、macOS Intel/Apple Silicon）。Python 已随包内置；桌面端可从应用内下载并重新安装。更新内容见仓库 CHANGELOG.md。" \
            --prerelease \
            release/*
