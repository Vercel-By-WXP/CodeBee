appId: com.codebee.desktop
productName: CodeBee
asar: true
directories:
  output: dist
  buildResources: assets
files:
  - main.cjs
  - lib/**
  - startup.html
  - assets/trayTemplate.png
  - package.json
extraResources:
  - from: ../app
    to: codebee/app
    filter:
      - '**/*'
      - '!tests/**'
      - '!**/__pycache__/**'
      - '!**/*.pyc'
      - '!output/**'
  - from: ../tools/wx_reader.py
    to: codebee/tools/wx_reader.py
  - from: ../package.json
    to: codebee/package.json
  - from: ../CHANGELOG.md
    to: codebee/CHANGELOG.md
  - from: ../LICENSE
    to: codebee/LICENSE
  - from: runtime/python
    to: python
  - from: runtime/manifest.json
    to: python-runtime.json
beforePack: scripts/before-pack.cjs
afterPack: scripts/after-pack.cjs
artifactName: 'CodeBee-${version}-${os}-${arch}.${ext}'
win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
mac:
  category: public.app-category.developer-tools
  hardenedRuntime: true
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
dmg:
  title: 'CodeBee ${version}'
publish: null
