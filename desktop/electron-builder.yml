appId: com.codebee.desktop
productName: CodeBee
asar: true
directories:
  output: dist
  buildResources: assets
files:
  - main.cjs
  - lib/**
  - startup.html
  - assets/trayTemplate.png
  - package.json
extraResources:
  - from: assets/icon-512.png
    to: codebee/icon.png
  - from: ../app
    to: codebee/app
    filter:
      - '**/*'
      - '!**/__pycache__/**'
      - '!**/*.pyc'
      - '!output/**'
  - from: ../tools/wx_reader.py
    to: codebee/tools/wx_reader.py
  - from: ../package.json
    to: codebee/package.json
  - from: ../CHANGELOG.md
    to: codebee/CHANGELOG.md
  - from: ../LICENSE
    to: codebee/LICENSE
  - from: runtime/python
    to: python
  - from: runtime/manifest.json
    to: python-runtime.json
beforePack: scripts/before-pack.cjs
artifactBuildStarted: scripts/artifact-build-started.cjs
afterPack: scripts/after-pack.cjs
artifactName: 'CodeBee-${version}-${os}-${arch}.${ext}'
win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  warningsAsErrors: true
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
mac:
  icon: assets/icon.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist
  # Universal merge: each arch bundles its own native runtime under python/<arch>.
  # Without this rule electron-builder sees the x64-side files as "same in both
  # builds" and aborts the universal build.
  x64ArchFiles: "Contents/Resources/python/x64/**"
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
dmg:
  title: 'CodeBee ${version}'
linux:
  category: Development
  icon: assets/icon-512.png
  maintainer: 'CodeBee <codebee@users.noreply.github.com>'
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
    - target: rpm
      arch: [x64]
publish: null
