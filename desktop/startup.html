<html lang="zh-CN">
<meta charset="utf-8">

<title>CodeBee · 正在启动</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, -apple-system, sans-serif; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: light-dark(#f4f7fb, #121922); color: light-dark(#162b43, #e6eef9); }

  h1 { font-size: 36px; letter-spacing: -.04em; margin: 0 0 18px; }
